<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us WhiteWater Rafting Tsiadana</title>
    <meta name="description"
      content="The place to contact us, either for further explanations or to book your seat">
    <meta name="author" content="Emaneke A. Tsinjondraza Tranombiby">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="This is our official logo inspired by pirates" width="150">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>WhiteWater Rafting Tsiadana</h1>
        <div class="address">
            <p>13 Route de l'Université</p>
            <p>Tsiadana Antananarivo</p>
            <p>+261xxxxxxxxxxx</p>
            <p>tsiadana.rafting@wanadoo.mg</p>
        </div>

        <!-- <div class="under-title">
                <p>13 Route de l'Université Tsiadana Antananarivo +261300000000
                    tsiadana.rafting@wanadoo.mg</p>
            </div> -->


        <section class="fillmap">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d3774.312601224462!2d47.548219249999995!3d-18.9175526!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sfr!2smg!4v1770396054666!5m2!1sfr!2smg"
              width="600" height="450" allowfullscreen="" loading="lazy"
              referrerpolicy="no-referrer-when-downgrade">
            </iframe>
            <form class="box">
                <div class="question">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required placeholder="emaneke">
                </div>
                <div class="question">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="abcdef@yahoo.fr">
                </div>
                <div class="question">
                    <label>Message purpose</label>
                    <div class="options">
                        <div class="option-child">
                            <input type="radio" id="inquiry" name="inquiry">
                            <label for="inquiry">General Inquiry</label>
                        </div>
                        <div class="option-child">
                            <input type="radio" id="reservation" name="inquiry">
                            <label for="reservation">Reservation Question</label>
                        </div>
                        <div class="option-child">
                            <input type="radio" id="suggestion" name="inquiry">
                            <label for="suggestion">Website Suggestion</label>
                        </div>
                    </div>
                </div>
                <div class="response">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" cols="50">lalalala</textarea>
                </div>
                <div class="check">
                    <input type="checkbox" id="subscribe" name="subscribe">
                    <label for="subscribe">Please subscribe me to the monthly newsletter</label>

                </div>
                <button type="submit">Get in touch</button>
            </form>
        </section>
        <section>
            <h2>We are here to serve you</h2>
            <div class="team">
                <figure>
                    <img src="images/jennito.jpg" alt="The experienced Jennito withdraws fear"
                      width="125">
                    <figcaption>Jennito, Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/laurie.jpg" alt="Laurie, always smiling" width="125">
                    <figcaption>Laurie, Guide</figcaption>
                </figure>
                <figure><img src="images/kris.jpg" alt="The serviable Kris, our englishman"
                      width="125">
                    <figcaption>Kris, Helper</figcaption>
                </figure>

            </div>
        </section>

    </main>
    <footer>
        <p>© 2026 WhiteWater Rafting Tsiadana, Tsinjondraza</p>
        <nav class="socialmedia">
            <a href="https://www.instagram.com/"><img src="images/instalogo.png"
                  alt="Instagram Logo" width="25"></a>
            <a href="https://facebook.com"><img src="images/fblogo.png" alt="FB logo"
                  width="25"></a>
            <a href="https://youtube.com"><img src="images/youtubelogo.png" alt="YouTube Logo"
                  width="25"></a>
        </nav>
    </footer>
</body>

</html>
