<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header></header>
    <main>
        <form>
            <label for="full name">Username</label>
            <input type="text" id="fullname" name="fullname" required>

            <label for="useremail">useremail</label>
            <input type="email" id="useremail" name="useremail" required>

            <label for="brwser">What is Your Favorite Browser?</label>
            <select name="browser" id="browser">
                <option value="chrome">Chrome</option>
                <option value="edge">Edge</option>
                <option value="safari">Safari</option>
                <option value="brave">Brave</option>
                <option value="crado">Crado</option>
            </select>

            <label for="pet">Do you have a household pet?</label>
            <input type="checkbox" id="pet" name="pet">

            <label for="feedback">List four places where you have lived:</label>
            <textarea type="place" id="feedback" name="feedback" rows="4"
              placeholder="Antananarivo, Mahajanga, Ampanihy, Maroantsetra"></textarea>

            <button type="submit">Submit Poll</button>
        </form>
    </main>
    <footer></footer>
</body>

</html>
