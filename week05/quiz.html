<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header></header>
    <main class="box">
        <h1>Quiz about html and css</h1>
        <form class="box">
            <div class="quiz-item box">
                <label for="q1">1. What does the label 'CSS' stand for?</label>
                <input type="text" id="q1" name="q1" required>
            </div>
            <div class="quiz-item box">
                <label for="q2">2. How are IDs and class selected in CSS?</label>
                <textarea id="q2" name="q2"></textarea>
            </div>

            <div class="quiz-item box">
                <label for="q3">3. Which of the following is a valid CSS selection?</label>
                <select id="q3" name="q3">
                    <option value="" selected disabled>Choose one</option>
                    <option value="1">&lt HEADER: {align-everything: middle-east;} &gt</option>
                    <option value="2">.hero{background-color: rgb(0 0 134);}</option>
                    <option value="3">corpus@TH{Zidane: 1O; Ronaldo: 9; }</option>
                </select>
            </div>
            <div class="quiz-item box">
                <label for="q4">4. What is the bottom margin given the following code?</label>
                <code class="box">margin: 1px 2px 5px;</code>
                <input type="number" id="q4" name="q4">
            </div>

            <button type="submit">Submit Quiz</button>
        </form>

    </main>
    <footer></footer>
</body>

</html>
